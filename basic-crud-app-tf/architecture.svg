<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#527FFF"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="980" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="36" font-size="22" font-weight="700" fill="#232F3E">CRUD App — AWS Architecture</text>
  <text x="30" y="58" font-size="13" fill="#5a6b7b">Terraform provisions the infra; EC2 userdata + Ansible configure the app server</text>

  <!-- Legend -->
  <g font-size="11" fill="#232F3E">
    <rect x="1000" y="16" width="12" height="12" fill="#ED7100"/><text x="1017" y="26">Compute</text>
    <rect x="1080" y="16" width="12" height="12" fill="#527FFF"/><text x="1097" y="26">Database</text>
    <rect x="1160" y="16" width="12" height="12" fill="#7AA116"/><text x="1177" y="26">Storage</text>
    <rect x="1240" y="16" width="12" height="12" fill="#DD344C"/><text x="1257" y="26">Security/Identity</text>
    <rect x="1000" y="34" width="12" height="12" fill="#E7157B"/><text x="1017" y="44">Management</text>
  </g>

  <!-- User / Internet -->
  <g>
    <circle cx="70" cy="330" r="22" fill="#eef2f7" stroke="#5a6b7b" stroke-width="1.5"/>
    <circle cx="70" cy="322" r="7" fill="#5a6b7b"/>
    <path d="M56,343 q14,-16 28,0" fill="none" stroke="#5a6b7b" stroke-width="2"/>
    <text x="70" y="368" font-size="12" text-anchor="middle" fill="#232F3E">You / Users</text>
  </g>

  <!-- Arrow: user -> EC2 (HTTP) -->
  <line x1="95" y1="325" x2="255" y2="270" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="140" y="290" font-size="11" fill="#232F3E">HTTP :80</text>

  <!-- Arrow: user -> Session Manager -->
  <line x1="90" y1="345" x2="1005" y2="705" stroke="#888" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="420" y="560" font-size="11" fill="#5a6b7b">aws ssm start-session (no SSH)</text>

  <!-- AWS Cloud boundary -->
  <rect x="160" y="90" width="1200" height="830" rx="10" fill="none" stroke="#232F3E" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="176" y="112" font-size="13" font-weight="600" fill="#232F3E">AWS Cloud — us-east-1</text>

  <!-- VPC boundary -->
  <rect x="190" y="140" width="600" height="460" rx="8" fill="#f7fbff" stroke="#527FFF" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="204" y="160" font-size="12" font-weight="600" fill="#3B48CC">Default VPC</text>

  <!-- Public Subnet -->
  <rect x="212" y="178" width="560" height="180" rx="6" fill="#eef6ff" stroke="#527FFF" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="224" y="196" font-size="11" font-weight="600" fill="#3B48CC">Public Subnet</text>

  <!-- EC2 icon -->
  <g>
    <rect x="234" y="208" width="190" height="110" rx="8" fill="#ED7100"/>
    <rect x="252" y="226" width="60" height="14" rx="2" fill="#fff"/>
    <rect x="252" y="244" width="60" height="14" rx="2" fill="#fff"/>
    <rect x="252" y="262" width="60" height="14" rx="2" fill="#fff"/>
    <text x="326" y="238" font-size="12" font-weight="700" fill="#fff">EC2</text>
    <text x="326" y="254" font-size="10" fill="#fff">crud-app-app</text>
    <text x="326" y="268" font-size="9.5" fill="#ffe6cc">Amazon Linux 2023</text>
    <text x="252" y="300" font-size="9.5" fill="#fff">SG: ec2-sg</text>
    <text x="252" y="312" font-size="9.5" fill="#fff">in 80/tcp · out all</text>
  </g>

  <!-- IAM Role icon -->
  <g>
    <rect x="454" y="208" width="150" height="110" rx="8" fill="#DD344C"/>
    <circle cx="480" cy="240" r="10" fill="#fff"/>
    <rect x="474" y="252" width="12" height="16" fill="#fff"/>
    <text x="500" y="238" font-size="11.5" font-weight="700" fill="#fff">IAM Role</text>
    <text x="500" y="252" font-size="9.5" fill="#ffd9df">crud-app-ec2-role</text>
    <text x="466" y="272" font-size="8.7" fill="#fff">SSMManagedInstanceCore</text>
    <text x="466" y="284" font-size="8.7" fill="#fff">S3 read (app bucket)</text>
    <text x="466" y="296" font-size="8.7" fill="#fff">ssm:GetParameter(s)</text>
    <text x="466" y="308" font-size="8.7" fill="#fff">kms:Decrypt (aws/ssm)</text>
  </g>

  <!-- RDS Subnet Group -->
  <rect x="212" y="376" width="560" height="200" rx="6" fill="#eef6ff" stroke="#527FFF" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="224" y="394" font-size="11" font-weight="600" fill="#3B48CC">DB Subnet Group (not publicly accessible)</text>

  <!-- RDS icon -->
  <g>
    <rect x="234" y="410" width="190" height="110" rx="8" fill="#527FFF"/>
    <ellipse cx="280" cy="436" rx="20" ry="8" fill="#fff"/>
    <path d="M260,436 v20 a20,8 0 0 0 40,0 v-20" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M260,448 a20,8 0 0 0 40,0" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="318" y="434" font-size="12" font-weight="700" fill="#fff">RDS · MySQL</text>
    <text x="318" y="450" font-size="10" fill="#fff">crud-app-db</text>
    <text x="252" y="500" font-size="9.5" fill="#fff">SG: rds-sg</text>
    <text x="252" y="512" font-size="9.5" fill="#fff">3306/tcp from ec2-sg only</text>
  </g>

  <!-- SG-to-SG arrow EC2 -> RDS -->
  <line x1="329" y1="318" x2="329" y2="408" stroke="#527FFF" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="336" y="368" font-size="10.5" fill="#3B48CC">③ schema import +</text>
  <text x="336" y="382" font-size="10.5" fill="#3B48CC">app queries :3306</text>

  <!-- Regional services column -->
  <text x="830" y="160" font-size="12" font-weight="600" fill="#232F3E">Regional services (outside the VPC)</text>

  <!-- S3 -->
  <g>
    <path d="M830,190 h190 v90 l-95,18 l-95,-18 z" fill="#7AA116"/>
    <text x="925" y="222" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">S3 Bucket</text>
    <text x="925" y="238" font-size="9.5" fill="#eaf3d8" text-anchor="middle">crud-app-&lt;suffix&gt;</text>
    <text x="925" y="256" font-size="8.7" fill="#eaf3d8" text-anchor="middle">app/*.php, schema.sql</text>
    <text x="925" y="268" font-size="8.7" fill="#eaf3d8" text-anchor="middle">ansible/setup.yml</text>
  </g>

  <!-- SSM Parameter Store -->
  <g>
    <rect x="830" y="330" width="190" height="100" rx="8" fill="#E7157B"/>
    <rect x="850" y="352" width="18" height="18" fill="#fff"/>
    <rect x="874" y="352" width="18" height="18" fill="#fff"/>
    <text x="900" y="362" font-size="11" font-weight="700" fill="#fff" text-anchor="start" dx="8">SSM Parameter</text>
    <text x="900" y="378" font-size="11" font-weight="700" fill="#fff" dx="8">Store</text>
    <text x="850" y="404" font-size="8.5" fill="#ffd6e8">/crud-app/db/host,port,</text>
    <text x="850" y="416" font-size="8.5" fill="#ffd6e8">name,username,password*</text>
    <text x="850" y="428" font-size="8" fill="#ffd6e8">*password = SecureString</text>
  </g>

  <!-- KMS -->
  <g>
    <rect x="830" y="460" width="190" height="80" rx="8" fill="#DD344C"/>
    <circle cx="856" cy="500" r="10" fill="#fff"/>
    <rect x="864" y="497" width="20" height="6" fill="#fff"/>
    <text x="880" y="490" font-size="11.5" font-weight="700" fill="#fff">KMS</text>
    <text x="880" y="504" font-size="9" fill="#ffd9df">alias/aws/ssm</text>
    <text x="880" y="516" font-size="8.7" fill="#ffd9df">decrypts SecureString</text>
  </g>

  <!-- Systems Manager (Session Manager) -->
  <g>
    <rect x="830" y="660" width="190" height="90" rx="8" fill="#E7157B"/>
    <circle cx="858" cy="700" r="12" fill="none" stroke="#fff" stroke-width="2.5"/>
    <circle cx="858" cy="700" r="4" fill="#fff"/>
    <text x="884" y="696" font-size="11" font-weight="700" fill="#fff">Systems Manager</text>
    <text x="884" y="710" font-size="10" fill="#fff">Session Manager</text>
    <text x="850" y="730" font-size="8.7" fill="#ffd6e8">Shell access — no SSH,</text>
    <text x="850" y="742" font-size="8.7" fill="#ffd6e8">no inbound port needed</text>
  </g>

  <!-- Arrows from EC2 to regional services -->
  <line x1="424" y1="240" x2="828" y2="235" stroke="#7AA116" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="500" y="228" font-size="10.5" fill="#4b6b0f">① userdata: aws s3 cp</text>
  <text x="500" y="256" font-size="9.5" fill="#4b6b0f">(app files + playbook → /srv)</text>

  <line x1="424" y1="280" x2="828" y2="375" stroke="#c21361" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="512" y="322" font-size="10.5" fill="#c21361">② ansible: aws ssm get-parameter</text>
  <text x="512" y="336" font-size="9.5" fill="#c21361">--with-decryption</text>

  <line x1="1020" y1="400" x2="1020" y2="458" stroke="#c21361" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="1030" y="435" font-size="9.5" fill="#c21361">decrypt</text>

  <line x1="925" y1="700" x2="424" y2="290" stroke="#c21361" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- IAM role grants (dotted) -->
  <line x1="604" y1="250" x2="828" y2="235" stroke="#DD344C" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="604" y1="270" x2="828" y2="390" stroke="#DD344C" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="604" y1="290" x2="828" y2="500" stroke="#DD344C" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="612" y="340" font-size="9" fill="#DD344C" font-style="italic">IAM role grants access to↑</text>

  <!-- Deploy order footer -->
  <rect x="190" y="820" width="1150" height="80" rx="8" fill="#f4f6f8" stroke="#c7d0d9"/>
  <text x="206" y="842" font-size="11.5" font-weight="700" fill="#232F3E">Terraform build order (aws_instance.app depends_on the DB + all SSM parameters):</text>
  <text x="206" y="862" font-size="11" fill="#232F3E">1. RDS (crud-app-db) created and reaches "available"  →  2. DB details written to SSM Parameter Store  →</text>
  <text x="206" y="880" font-size="11" fill="#232F3E">3. EC2 instance launches  →  4. userdata downloads from S3, installs Ansible, runs setup.yml (Apache/PHP/schema/import)</text>

  <text x="30" y="950" font-size="10" fill="#8a97a3">Generated for Terraform/basic-crud-app-tf — icons are simplified, AWS-notation-styled representations, not official AWS icon assets.</text>
</svg>
